footprint: [[-0.20, -0.095], [-0.20, 0.095], [0.13, 0.095], [0.13, -0.095]]
footprint_padding: 0.0  # the measured polygon already includes 2 cm clearance
transform_tolerance: 0.30

obstacle_layer:
  enabled: true
  observation_sources: scan
  combination_method: 1
  track_unknown_space: true
  obstacle_range: 4.0
  raytrace_range: 5.0
  max_obstacle_height: 0.60
  # /scan is projected into base_link: LaserScan hits have z=0 in this frame.
  min_obstacle_height: -0.05
  scan:
    topic: /scan
    data_type: LaserScan
    marking: true
    clearing: true
    inf_is_valid: true
    observation_persistence: 0.0
    expected_update_rate: 0.20
    min_obstacle_height: -0.05
    max_obstacle_height: 0.60

inflation_layer:
  enabled: true
  inflation_radius: 0.1
  cost_scaling_factor: 3.0
