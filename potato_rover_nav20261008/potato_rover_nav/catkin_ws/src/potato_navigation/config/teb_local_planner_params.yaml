TebLocalPlannerROS:
  odom_topic: /odom
  map_frame: map

  max_vel_x: 0.25
  max_vel_x_backwards: 0.10
  max_vel_y: 0.0
  max_vel_theta: 1.20
  acc_lim_x: 0.20
  acc_lim_y: 0.0
  acc_lim_theta: 1.00
  min_turning_radius: 0.0
  wheelbase: 0.30
  cmd_angle_instead_rotvel: false
  holonomic_robot: false

  footprint_model:
    type: polygon
    vertices: [[-0.20, -0.095], [-0.20, 0.095], [0.13, 0.095], [0.13, -0.095]]

  xy_goal_tolerance: 0.15
  yaw_goal_tolerance: 0.25
  free_goal_vel: false
  complete_global_plan: true

  dt_ref: 0.30
  dt_hysteresis: 0.10
  min_samples: 3
  max_samples: 500
  global_plan_overwrite_orientation: true
  allow_init_with_backwards_motion: false
  max_global_plan_lookahead_dist: 3.0
  global_plan_viapoint_sep: 0.40
  exact_arc_length: false
  feasibility_check_no_poses: 5
  publish_feedback: false

  min_obstacle_dist: 0.1
  inflation_dist: 0.1
  include_costmap_obstacles: true
  costmap_obstacles_behind_robot_dist: 1.0
  obstacle_poses_affected: 15
  include_dynamic_obstacles: true
  dynamic_obstacle_inflation_dist: 0.1
  costmap_converter_plugin: ""
  costmap_converter_spin_thread: true
  costmap_converter_rate: 5

  no_inner_iterations: 5
  no_outer_iterations: 4
  optimization_activate: true
  optimization_verbose: false
  penalty_epsilon: 0.05
  obstacle_cost_exponent: 2.0
  weight_max_vel_x: 2.0
  weight_max_vel_y: 1000.0
  weight_max_vel_theta: 2.0
  weight_acc_lim_x: 5.0
  weight_acc_lim_y: 1000.0
  weight_acc_lim_theta: 5.0
  weight_kinematics_nh: 1000.0
  weight_kinematics_forward_drive: 10.0
  weight_kinematics_turning_radius: 1.0
  weight_optimaltime: 3.0
  weight_shortest_path: 0.0
  weight_obstacle: 120.0
  weight_inflation: 0.50
  weight_dynamic_obstacle: 20.0
  weight_dynamic_obstacle_inflation: 0.20
  weight_viapoint: 1.0
  weight_adapt_factor: 2.0

  enable_homotopy_class_planning: true
  enable_multithreading: true
  max_number_classes: 2
  selection_cost_hysteresis: 1.0
  selection_prefer_initial_plan: 0.90
  selection_obst_cost_scale: 100.0
  selection_alternative_time_cost: false
  roadmap_graph_no_samples: 12
  roadmap_graph_area_width: 4.0
  h_signature_prescaler: 0.5
  h_signature_threshold: 0.1
  obstacle_heading_threshold: 0.45
  switching_blocking_period: 0.0
